name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Capacitor Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          find . -maxdepth 1 -type f \( -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.svg' -o -name '*.webp' -o -name '*.ico' -o -name '*.json' \) ! -name 'package*.json' ! -name 'capacitor.config.*' -exec cp {} www/ \;
          if [ -d assets ]; then cp -r assets www/; fi

      - name: Initialize Capacitor and Add Android Platform
        run: |
          npm init -y
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 @capacitor/filesystem@^6.0.0 @capacitor/share@^6.0.0 @capacitor/haptics@^6.0.0
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.buyorbye.app",
            "appName": "살까말까판독기",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": [
                "*.firebaseio.com",
                "*.firebasedatabase.app",
                "*.googleapis.com",
                "*.gstatic.com",
                "cdn.tailwindcss.com",
                "cdn.jsdelivr.net",
                "crengineer86-dot.github.io"
              ]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Apply Custom Launcher Icons & Resources
        run: |
          if [ -d "android-assets/res" ]; then
            cp -r android-assets/res/* android/app/src/main/res/
            echo "Successfully applied custom calculator launcher icons to android/app/src/main/res/"
          fi

      - name: Configure Android Permissions & WebView Settings
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import re

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")

          for perm in [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.VIBRATE",
          ]:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in manifest:
                  manifest = manifest.replace("</manifest>", f"    {tag}\n</manifest>", 1)

          if "android.permission.WRITE_EXTERNAL_STORAGE" not in manifest:
              manifest = manifest.replace(
                  "</manifest>",
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>',
                  1,
              )

          if "android:usesCleartextTraffic" not in manifest:
              manifest = re.sub(
                  r"<application\b",
                  '<application android:usesCleartextTraffic="true"',
                  manifest,
                  count=1,
              )

          manifest_path.write_text(manifest, encoding="utf-8")

          main_activity = Path("android/app/src/main/java/com/buyorbye/app/MainActivity.java")
          main_activity.write_text(
              """package com.buyorbye.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              public static class AndroidGalleryBridge {
                  private final Context context;

                  public AndroidGalleryBridge(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public String saveImageToGallery(String dataUrlOrBase64, String fileName) {
                      try {
                          if (dataUrlOrBase64 == null || dataUrlOrBase64.isEmpty()) {
                              return "ERR:EMPTY";
                          }
                          String cleanBase64 = dataUrlOrBase64.contains(",")
                              ? dataUrlOrBase64.substring(dataUrlOrBase64.indexOf(",") + 1)
                              : dataUrlOrBase64;
                          byte[] imageBytes = Base64.decode(cleanBase64, Base64.DEFAULT);
                          String safeName = (fileName == null || fileName.trim().isEmpty())
                              ? "buy_or_bye_" + System.currentTimeMillis() + ".png"
                              : fileName.trim();
                          if (!safeName.toLowerCase().endsWith(".png")) {
                              safeName += ".png";
                          }

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = context.getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Images.Media.DISPLAY_NAME, safeName);
                              values.put(MediaStore.Images.Media.MIME_TYPE, "image/png");
                              values.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/BuyOrBye");
                              values.put(MediaStore.Images.Media.IS_PENDING, 1);

                              Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) {
                                  return "ERR:URI_NULL";
                              }
                              try (OutputStream out = resolver.openOutputStream(uri)) {
                                  if (out == null) {
                                      return "ERR:STREAM_NULL";
                                  }
                                  out.write(imageBytes);
                                  out.flush();
                              }
                              values.clear();
                              values.put(MediaStore.Images.Media.IS_PENDING, 0);
                              resolver.update(uri, values, null, null);
                              return "OK";
                          } else {
                              File picturesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES);
                              File appDir = new File(picturesDir, "BuyOrBye");
                              if (!appDir.exists() && !appDir.mkdirs()) {
                                  return "ERR:MKDIR_FAILED";
                              }
                              File outFile = new File(appDir, safeName);
                              try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                  fos.write(imageBytes);
                                  fos.flush();
                              }
                              MediaScannerConnection.scanFile(
                                  context,
                                  new String[] { outFile.getAbsolutePath() },
                                  new String[] { "image/png" },
                                  null
                              );
                              return "OK";
                          }
                      } catch (Exception e) {
                          return "ERR:" + e.getMessage();
                      }
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView webView = getBridge().getWebView();
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setTextZoom(100);
                      settings.setUseWideViewPort(true);
                      settings.setLoadWithOverviewMode(true);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                      final AndroidGalleryBridge galleryBridge = new AndroidGalleryBridge(this);
                      webView.addJavascriptInterface(galleryBridge, "AndroidGalleryBridge");
                      webView.setDownloadListener(new DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                              if (url != null && url.startsWith("data:image/")) {
                                  galleryBridge.saveImageToGallery(url, "buy_or_bye_" + System.currentTimeMillis() + ".png");
                              }
                          }
                      });
                  }
              }
          }
          """,
              encoding="utf-8",
          )
          PY

      - name: Ensure Android Platform SDK & Build Debug APK
        shell: bash
        run: |
          set +o pipefail
          COMPILE_SDK=$(grep -oE 'compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+' android/variables.gradle | grep -oE '[0-9]+' | head -n 1 || echo "34")
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ] && [ -n "$COMPILE_SDK" ]; then
            yes | "$SDKMANAGER" "platforms;android-${COMPILE_SDK}" > /dev/null || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buy-or-bye-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
